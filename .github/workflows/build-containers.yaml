---
name: Build and Push Containers

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/efficacy38

jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Get Tailscale version
        id: version
        run: |
          VERSION=$(nix eval --raw .#tailscale-userspace.imageTag)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: get-version
    strategy:
      matrix:
        image: [userspace, derp]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build tailscale-${{ matrix.image }} image
        run: |
          nix build .#tailscale-${{ matrix.image }}

      - name: Push arch-specific image
        run: |
          DOCKER_REPOSITORY="docker://${{ env.IMAGE_PREFIX }}/tailscale-${{ matrix.image }}:${{ needs.get-version.outputs.version }}-${{ matrix.arch }}"
          skopeo --insecure-policy copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-archive:./result" \
            "$DOCKER_REPOSITORY"

  manifest:
    needs: [get-version, build]
    strategy:
      matrix:
        image: [userspace, derp]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (versioned)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_PREFIX }}/tailscale-${{ matrix.image }}:${{ needs.get-version.outputs.version }}" \
            "${{ env.IMAGE_PREFIX }}/tailscale-${{ matrix.image }}:${{ needs.get-version.outputs.version }}-amd64" \
            "${{ env.IMAGE_PREFIX }}/tailscale-${{ matrix.image }}:${{ needs.get-version.outputs.version }}-arm64"

      - name: Create multi-arch manifest (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_PREFIX }}/tailscale-${{ matrix.image }}:latest" \
            "${{ env.IMAGE_PREFIX }}/tailscale-${{ matrix.image }}:${{ needs.get-version.outputs.version }}-amd64" \
            "${{ env.IMAGE_PREFIX }}/tailscale-${{ matrix.image }}:${{ needs.get-version.outputs.version }}-arm64"
